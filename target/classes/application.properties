server.port=8081

# Spring Application Name
spring.application.name=toll-plaza-service

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:tolldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cache Configuration
spring.cache.type=concurrent

# Jackson JSON formatting
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent_output=true

# Logging
logging.level.com.freightfox.tollplaza=INFO
logging.level.org.springframework.web=INFO

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
